<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情 - 小姚的太空博客</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <canvas id="starfield"></canvas>
  
  <div class="container">
    <header class="site-header">
      <a href="/" class="back-link">← 返回星海</a>
      <div class="header-decoration" style="margin-bottom: 1.5rem;">
        <span class="deco-line"></span>
        <span class="deco-dot">✦</span>
        <span class="deco-line"></span>
      </div>
      <h1 id="post-title" class="site-title" style="font-size: 2rem;"></h1>
      <div id="post-meta" class="post-meta"></div>
    </header>

    <main>
      <article id="post-content" class="post-content glass-card">
        <p class="loading">正在从遥远星系传输内容...</p>
      </article>

      <div style="text-align: center; margin-top: 2rem;">
        <a href="/" class="btn-neon" style="text-decoration: none;">← 返回文章列表</a>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <p>© 2026 小姚的太空博客</p>
        <p class="footer-sub">Powered by Node.js & GitHub Pages</p>
      </div>
    </footer>
  </div>

  <script src="/js/post.js"></script>
</body>
</html>
