<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写文章 - 小姚的太空博客</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="container">
    <header class="site-header">
      <a href="/" class="back-link">← 返回星海</a>
      <h1 class="site-title">✍️ 写新文章</h1>
      <p class="site-desc">把你的生活记录发射到星空</p>
    </header>
    <main>
      <div class="glass-card admin-form">
        <div class="form-group">
          <label for="post-title-input">标题</label>
          <input type="text" id="post-title-input" placeholder="给这颗星星起个名字..." />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="post-date-input">日期</label>
            <input type="date" id="post-date-input" />
          </div>
          <div class="form-group">
            <label for="post-tags-input">标签（逗号分隔）</label>
            <input type="text" id="post-tags-input" placeholder="生活, 科幻, 日记" />
          </div>
        </div>
        <div class="form-group">
          <label for="post-summary-input">摘要</label>
          <input type="text" id="post-summary-input" placeholder="简短描述这篇文章..." />
        </div>
        <div class="form-group">
          <label for="post-body-input">正文（支持 Markdown）</label>
          <textarea id="post-body-input" rows="16" placeholder="用 Markdown 写下你的故事...&#10;&#10;# 标题&#10;**粗体** *斜体*&#10;- 列表项&#10;&#10;```js&#10;// 代码块&#10;```"></textarea>
        </div>
        <div class="form-actions">
          <button id="btn-submit" class="btn-neon">🚀 发布到星空</button>
          <button id="btn-preview" class="btn-neon btn-secondary">👁️ 预览</button>
        </div>
        <div id="preview-area" class="preview-area" style="display:none;"></div>
        <p id="msg" class="msg"></p>
      </div>
    </main>
    <footer class="site-footer">
      <p>© 2026 小姚的太空博客 · Powered by Node.js</p>
    </footer>
  </div>
  <script src="/js/admin.js"></script>
</body>
</html>
