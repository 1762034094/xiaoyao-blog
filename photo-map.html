<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影足迹 — 知隅</title>
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="css/photo-map.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="pm-header">
        <a href="index.html" class="pm-back">← 返回首页</a>
        <h1>📷 摄影足迹</h1>
        <p>用镜头记录走过的每一寸土地</p>
    </header>

    <!-- 地图区 -->
    <div class="pm-map-wrap">
        <div id="china-map"></div>
    </div>

    <!-- 照片列表区 -->
    <div class="pm-gallery" id="gallery">
        <!-- JS 动态生成 -->
    </div>

    <!-- 灯箱 -->
    <div class="pm-lightbox" id="lightbox">
        <span class="pm-lightbox-close" id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="">
        <p id="lightbox-info"></p>
    </div>

    <script src="data/photos.js"></script>
    <script src="js/photo-map.js?v=3"></script>
</body>
</html>
